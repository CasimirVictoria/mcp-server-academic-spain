[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-academic-spain"
version = "1.0.0"
description = "Model Context Protocol (MCP) server for unified scientific literature search across Spanish & international academic databases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Casimir", email = "casimir@users.noreply.github.com" }
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
mcp-server-academic-spain = "server:main"
